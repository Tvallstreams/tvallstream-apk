name: Build APK & Web Preview

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android platform files if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android,web .
          fi

      - name: Fix truncated lines in main.dart and player_page.dart
        run: |
          python3 -c '
          with open("lib/main.dart", "r") as f:
              lines = f.readlines()
          fixed = []
          for i, line in enumerate(lines):
              if "const SizedBox(height: 4)," in line and i > 0 and not lines[i-1].strip().endswith(","):
                  fixed[-1] = "                              const Text(\x27ENDEREÇO MAC DO DISPOSITIVO\x27, style: TextStyle(color: Colors.white54, fontSize: 10, fontWeight: FontWeight.w700)),\n"
              fixed.append(line)
          with open("lib/main.dart", "w") as f:
              f.writelines(fixed)

          with open("lib/player_page.dart", "r") as f:
              plines = f.readlines()
          pfixed = []
          for i, line in enumerate(plines):
              if "tituloAtual = nome;" in line and i > 0 and not plines[i-1].strip().endswith(";"):
                  pfixed[-1] = "      selectedId = id;\n"
              pfixed.append(line)
          with open("lib/player_page.dart", "w") as f:
              f.writelines(pfixed)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: TVAllstream APK v1.0.0
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web Preview
        run: |
          flutter config --enable-web
          flutter create --platforms=web .
          flutter build web --release --base-href "/tvallstream-apk/"

      - name: Deploy Web Preview to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
