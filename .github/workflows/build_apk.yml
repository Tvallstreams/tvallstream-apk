name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
      - name: Create Android platform files
        run: flutter create . --platforms=android --project-name=tvallstream_app
      - name: Configure AndroidManifest for TV Box compatibility
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<\/application>/    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" \/>\n    <\/application>/' android/app/src/main/AndroidManifest.xml
      - name: Get packages and build universal APK
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm,android-arm64
      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: TVAllstream APK v1.0.0
          files: build/app/outputs/flutter-apk/app-release.apk
