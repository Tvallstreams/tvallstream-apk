name: Build APK & Web Preview

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android platform files if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android,web .
          fi

      - name: Configure Android TV Banner, App Icon & Hardware MAC
        run: |
          mkdir -p android/app/src/main/res/drawable-xhdpi
          if [ -f "assets/tv_banner.png" ]; then
            cp assets/tv_banner.png android/app/src/main/res/drawable-xhdpi/tv_banner.png
          fi
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ] && [ -f "assets/logo.jpg" ]; then
              cp assets/logo.jpg "$dir/ic_launcher.jpg"
              rm -f "$dir/ic_launcher.png"
            fi
          done

          python3 -c '
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              xml = f.read()
          if "LEANBACK_LAUNCHER" not in xml:
              xml = xml.replace("<application", "<uses-feature android:name=\"android.software.leanback\" android:required=\"false\" />\n    <uses-feature android:name=\"android.hardware.touchscreen\" android:required=\"false\" />\n    <application android:banner=\"@drawable/tv_banner\"", 1)
              xml = xml.replace("<category android:name=\"android.intent.category.LAUNCHER\"/>", "<category android:name=\"android.intent.category.LAUNCHER\"/>\n                <category android:name=\"android.intent.category.LEANBACK_LAUNCHER\"/>", 1)
              with open(manifest_path, "w") as f:
                  f.write(xml)
          '

          MAIN_KT=$(find android/app/src/main/kotlin -name "MainActivity.kt" | head -n 1)
          PKG_LINE=$(head -n 1 "$MAIN_KT")
          cat << EOF > "$MAIN_KT"
          $PKG_LINE

          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.tvallstream/device").setMethodCallHandler { call, result ->
                      if (call.method == "getAndroidId") {
                          val id = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: ""
                          result.success(id)
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: TVAllstream APK v1.0.0
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web Preview
        run: |
          flutter config --enable-web
          flutter create --platforms=web .
          flutter build web --release --base-href "/tvallstream-apk/"

      - name: Deploy Web Preview to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
