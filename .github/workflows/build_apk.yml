name: Build APK & Web Preview

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android platform files if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android,web .
          fi

      - name: Configure Android TV Banner, App Icon & Hardware MAC
        run: |
          pip install -q Pillow
          mkdir -p android/app/src/main/res/drawable-xhdpi
          python3 -c 'import glob, os; from PIL import Image; Image.open("assets/tv_banner.png").convert("RGBA").resize((320, 180)).save("android/app/src/main/res/drawable-xhdpi/tv_banner.png", format="PNG") if os.path.exists("assets/tv_banner.png") else None; logo = Image.open("assets/logo.jpg").convert("RGBA") if os.path.exists("assets/logo.jpg") else None; [logo.resize((192, 192)).save(os.path.join(d, "ic_launcher.png"), format="PNG") for d in glob.glob("android/app/src/main/res/mipmap-*") if logo and os.path.isdir(d)]'
          python3 -c 'import glob; p = "android/app/src/main/AndroidManifest.xml"; xml = open(p).read(); xml = xml.replace("<application", "<uses-feature android:name=\"android.software.leanback\" android:required=\"false\" />\n    <uses-feature android:name=\"android.hardware.touchscreen\" android:required=\"false\" />\n    <application android:banner=\"@drawable/tv_banner\"", 1).replace("<category android:name=\"android.intent.category.LAUNCHER\"/>", "<category android:name=\"android.intent.category.LAUNCHER\"/>\n                <category android:name=\"android.intent.category.LEANBACK_LAUNCHER\"/>", 1) if "LEANBACK_LAUNCHER" not in xml else xml; open(p, "w").write(xml); kts = glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True); pkg = open(kts[0]).readline().strip() if kts else ""; open(kts[0], "w").write(pkg + "\n\nimport android.provider.Settings\nimport io.flutter.embedding.android.FlutterActivity\nimport io.flutter.embedding.engine.FlutterEngine\nimport io.flutter.plugin.common.MethodChannel\n\nclass MainActivity: FlutterActivity() {\n    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {\n        super.configureFlutterEngine(flutterEngine)\n        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, \"com.tvallstream/device\").setMethodCallHandler { call, result ->\n            if (call.method == \"getAndroidId\") {\n                val id = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: \"\"\n                result.success(id)\n            } else {\n                result.notImplemented()\n            }\n        }\n    }\n}\n") if kts else None'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: TVAllstream APK v1.0.0
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web Preview
        run: |
          flutter config --enable-web
          flutter create --platforms=web .
          flutter build web --release --base-href "/tvallstream-apk/"

      - name: Deploy Web Preview to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
