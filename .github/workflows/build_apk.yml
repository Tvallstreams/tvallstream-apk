name: Build APK & Web Preview

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android platform files if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android,web .
          fi

      - name: Write 3-Column Groups PlayerPage (Live, Movies & Series)
        run: |
          python3 -c '
          code = """import \x27dart:async\x27;
          import \x27dart:convert\x27;
          import \x27package:flutter/material.dart\x27;
          import \x27package:http/http.dart\x27 as http;
          import \x27package:video_player/video_player.dart\x27;
          import \x27main.dart\x27;

          class PlayerPage extends StatefulWidget {
            final Map<String, dynamic> account;
            final String initialAction;
            const PlayerPage({super.key, required this.account, this.initialAction = \x27get_live_streams\x27});

            @override
            State<PlayerPage> createState() => _PlayerPageState();
          }

          class _PlayerPageState extends State<PlayerPage> {
            VideoPlayerController? _videoController;
            final TextEditingController _searchController = TextEditingController();
            Timer? _osdTimer;

            late String tipoAtual;
            List<dynamic> categorias = [];
            String categoriaSelecionada = \x27ALL\x27;
            List<dynamic> itens = [];
            String filtroBusca = \x27\x27;

            bool carregandoLista = true;
            bool carregandoVideo = false;
            bool isFullScreen = false;
            bool showOsd = true;

            String? selectedId;
            String tituloAtual = \x27\x27;
            String? erroVideo;
            String? erroLista;

            String get dnsUrl => (widget.account[\x27dns_url\x27] ?? \x27\x27).toString().replaceAll(RegExp(r\x27/$\x27), \x27\x27);
            String get username => (widget.account[\x27username\x27] ?? \x27\x27).toString();
            String get password => (widget.account[\x27password\x27] ?? \x27\x27).toString();

            Map<String, String> get _headers => const {\x27User-Agent\x27: \x27IPTV Smarters Player\x27, \x27Accept\x27: \x27application/json\x27};

            List<dynamic> get itensFiltrados {
              return itens.where((raw) {
                final item = raw as Map<String, dynamic>;
                if (categoriaSelecionada != \x27ALL\x27 && (item[\x27category_id\x27] ?? \x27\x27).toString() != categoriaSelecionada) return false;
                if (filtroBusca.isNotEmpty && !(item[\x27name\x27] ?? \x27\x27).toString().toLowerCase().contains(filtroBusca.toLowerCase())) return false;
                return true;
              }).toList();
            }

            int _contarPorCategoria(String catId) {
              if (catId == \x27ALL\x27) return itens.length;
              return itens.where((raw) => ((raw as Map<String, dynamic>)[\x27category_id\x27] ?? \x27\x27).toString() == catId).length;
            }

            @override
            void initState() {
              super.initState();
              tipoAtual = widget.initialAction;
              _carregarSecao(tipoAtual);
            }

            @override
            void dispose() {
              _osdTimer?.cancel();
              _searchController.dispose();
              _videoController?.dispose();
              super.dispose();
            }

            void _triggerOsd() {
              setState(() => showOsd = true);
              _osdTimer?.cancel();
              _osdTimer = Timer(const Duration(seconds: 4), () {
                if (mounted && isFullScreen) setState(() => showOsd = false);
              });
            }

            void _entrarTelaCheia() {
              if (_videoController == null || !_videoController!.value.isInitialized) return;
              setState(() => isFullScreen = true);
              _triggerOsd();
            }

            void _sairTelaCheia() {
              _osdTimer?.cancel();
              setState(() {
                isFullScreen = false;
                showOsd = true;
              });
            }

            String _categoryActionFor(String streamAction) {
              if (streamAction == \x27get_vod_streams\x27) return \x27get_vod_categories\x27;
              if (streamAction == \x27get_series\x27) return \x27get_series_categories\x27;
              return \x27get_live_categories\x27;
            }

            Future<void> _carregarSecao(String action) async {
              setState(() {
                tipoAtual = action;
                carregandoLista = true;
                erroLista = null;
                categorias = [];
                categoriaSelecionada = \x27ALL\x27;
                itens = [];
                filtroBusca = \x27\x27;
                _searchController.clear();
              });

              try {
                final catAction = _categoryActionFor(action);
                final catUrl = Uri.parse(\x27$dnsUrl/player_api.php?username=${Uri.encodeComponent(username)}&password=${Uri.encodeComponent(password)}&action=$catAction\x27);
                final streamUrl = Uri.parse(\x27$dnsUrl/player_api.php?username=${Uri.encodeComponent(username)}&password=${Uri.encodeComponent(password)}&action=$action\x27);

                final results = await Future.wait([http.get(catUrl, headers: _headers), http.get(streamUrl, headers: _headers)]);
                if (results.first.statusCode == 200) {
                  final decodedCats = jsonDecode(results.first.body);
                  if (decodedCats is List) categorias = decodedCats;
                }
                if (results.last.statusCode == 200) {
                  final decoded = jsonDecode(results.last.body);
                  if (decoded is List) {
                    setState(() => itens = decoded);
                  } else {
                    setState(() => erroLista = \x27Resposta inesperada do servidor\x27);
                  }
                } else {
                  setState(() => erroLista = \x27Erro HTTP ${results.last.statusCode} ao buscar lista\x27);
                }
              } catch (e) {
                setState(() => erroLista = \x27Erro de rede: $e\x27);
              } finally {
                if (mounted) setState(() => carregandoLista = false);
              }
            }

            Future<void> _abrirSerie(Map<String, dynamic> serie) async {
              final seriesId = (serie[\x27series_id\x27] ?? \x27\x27).toString();
              final nomeSerie = (serie[\x27name\x27] ?? \x27Série\x27).toString();
              showDialog(context: context, barrierDismissible: false, builder: (_) => const Center(child: CircularProgressIndicator()));

              try {
                final url = Uri.parse(\x27$dnsUrl/player_api.php?username=${Uri.encodeComponent(username)}&password=${Uri.encodeComponent(password)}&action=get_series_info&series_id=$seriesId\x27);
                final res = await http.get(url, headers: _headers);
                if (!mounted) return;
                Navigator.pop(context);
                if (res.statusCode != 200) return;

                final data = jsonDecode(res.body);
                final episodesMap = (data is Map && data[\x27episodes\x27] is Map) ? data[\x27episodes\x27] as Map<String, dynamic> : <String, dynamic>{};
                if (episodesMap.isEmpty) return;

                final seasons = episodesMap.keys.toList();
                String selectedSeason = seasons.first;
                if (!mounted) return;
                await showDialog(
                  context: context,
                  builder: (ctx) => StatefulBuilder(
                    builder: (ctx, setModalState) {
                      final epList = (episodesMap[selectedSeason] as List?) ?? [];
                      return AlertDialog(
                        backgroundColor: const Color(0xFF151828),
                        title: Row(
                          children: [
                            Expanded(child: Text(nomeSerie, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(color: Colors.white))),
                            const SizedBox(width: 12),
                            DropdownButton<String>(
                              value: selectedSeason,
                              dropdownColor: const Color(0xFF23273D),
                              items: seasons.map((s) => DropdownMenuItem(value: s, child: Text(\x27Temporada $s\x27))).toList(),
                              onChanged: (val) {
                                if (val != null) setModalState(() => selectedSeason = val);
                              },
                            ),
                          ],
                        ),
                        content: SizedBox(
                          width: 520,
                          height: 320,
                          child: ListView.builder(
                            itemCount: epList.length,
                            itemBuilder: (_, idx) {
                              final ep = epList[idx] as Map<String, dynamic>;
                              final epNum = (ep[\x27episode_num\x27] ?? (idx + 1)).toString();
                              final epTitle = (ep[\x27title\x27] ?? \x27Episódio $epNum\x27).toString();
                              final epId = (ep[\x27id\x27] ?? \x27\x27).toString();
                              final ext = (ep[\x27container_extension\x27] ?? \x27mp4\x27).toString();
